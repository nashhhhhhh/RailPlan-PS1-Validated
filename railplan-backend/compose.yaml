services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: railplan
      POSTGRES_USER: railplan_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - railplan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railplan_owner -d railplan"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  railplan_pgdata:

