[project]
name = "railplan-backend"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.121,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
 "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "geoalchemy2>=0.15,<1",
 "pydantic>=2.8,<3", "ortools==9.14.6206"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pglast>=7,<9"]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
